name: CI

on:
  push:
    branches: [main, fix/autonomous-maintenance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  endpoint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
